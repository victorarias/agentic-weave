name: Hodor PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: hodor-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  hodor-review:
    if: ${{ !github.event.pull_request.draft && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HODOR_VERSION: v0.3.4
      HODOR_MODEL: google-vertex/gemini-3.1-pro-preview
      GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Detect Google auth configuration
        id: detect-auth
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          VERTEX_AI_SA: ${{ secrets.VERTEX_AI_SA }}
        run: |
          set -euo pipefail
          if [[ -n "${GCP_SERVICE_ACCOUNT_KEY:-}" ]]; then
            echo "has_gcp_service_account_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_gcp_service_account_key=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -n "${VERTEX_AI_SA:-}" ]]; then
            echo "has_vertex_ai_sa=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_vertex_ai_sa=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud via workload identity
        id: auth-wif
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Authenticate to Google Cloud via service account key
        id: auth-key-gcp
        if: ${{ (vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || vars.GCP_SERVICE_ACCOUNT == '') && steps.detect-auth.outputs.has_gcp_service_account_key == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Authenticate to Google Cloud via legacy attn secret
        id: auth-key-legacy
        if: ${{ (vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || vars.GCP_SERVICE_ACCOUNT == '') && steps.detect-auth.outputs.has_gcp_service_account_key != 'true' && steps.detect-auth.outputs.has_vertex_ai_sa == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.VERTEX_AI_SA }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Validate review configuration
        env:
          AUTH_PROJECT_ID: ${{ steps.auth-wif.outputs.project_id || steps.auth-key-gcp.outputs.project_id || steps.auth-key-legacy.outputs.project_id }}
          GOOGLE_CLOUD_PROJECT_SECRET: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        run: |
          set -euo pipefail

          GOOGLE_CLOUD_LOCATION="${GOOGLE_CLOUD_LOCATION:-global}"
          GOOGLE_CLOUD_PROJECT="${GOOGLE_CLOUD_PROJECT:-${AUTH_PROJECT_ID:-${GOOGLE_CLOUD_PROJECT_SECRET:-}}}"

          if [[ -z "${GOOGLE_CLOUD_PROJECT:-}" ]]; then
            echo "GOOGLE_CLOUD_PROJECT is required." >&2
            echo "Provide it as a repo variable, a repo secret, or via the authenticated service account metadata." >&2
            exit 1
          fi

          if [[ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]]; then
            echo "Google Cloud authentication is missing." >&2
            echo "Configure workload identity, GCP_SERVICE_ACCOUNT_KEY, or legacy VERTEX_AI_SA." >&2
            exit 1
          fi

          echo "GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}" >> "$GITHUB_ENV"
          echo "GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION}" >> "$GITHUB_ENV"

          gh --version
          echo "Using Hodor ${HODOR_VERSION} with model ${HODOR_MODEL}"
          echo "Vertex project: ${GOOGLE_CLOUD_PROJECT}"
          echo "Vertex location: ${GOOGLE_CLOUD_LOCATION}"

      - name: Install patched Hodor
        run: |
          set -euo pipefail
          git clone --depth=1 --branch "${HODOR_VERSION}" https://github.com/mr-karan/hodor /tmp/hodor
          cd /tmp/hodor
          git apply "${GITHUB_WORKSPACE}/.github/hodor/v0.3.4-google-vertex.patch"
          bun install --frozen-lockfile
          bun run build

      - name: Run Hodor review
        id: hodor
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_URL="https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          cd /tmp/hodor
          bun run dist/cli.js "$PR_URL" \
            --model "${HODOR_MODEL}" \
            --reasoning-effort high \
            --post \
            --verbose | tee /tmp/hodor-review.log

      - name: Upload Hodor logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hodor-review-${{ github.run_id }}
          path: /tmp/hodor-review.log
          retention-days: 7

      - name: Summarize Hodor review outcome
        if: always()
        run: |
          outcome='${{ steps.hodor.outcome }}'
          {
            echo "### Hodor review status: ${outcome}"
            echo
            echo "- Model: \\`${HODOR_MODEL}\\`"
            echo "- Hodor version: \\`${HODOR_VERSION}\\`"
            echo "- Workflow docs: \\`docs/09-hodor-pr-review.md\\`"
            echo
            if [[ "$outcome" == "success" ]]; then
              echo "Hodor completed successfully and posted an advisory review comment to the PR."
            elif [[ "$outcome" == "failure" ]]; then
              echo "The Hodor run failed. This workflow remains advisory; inspect the uploaded log artifact for details."
            elif [[ "$outcome" == "cancelled" ]]; then
              echo "The Hodor run was cancelled."
            else
              echo "Hodor step outcome: $outcome"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
